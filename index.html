<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>movies</title>
     <link rel="stylesheet" href="style.css">
     <script src="index.js" defer></script>
     <script src="https://kit.fontawesome.com/6b3ab86a61.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="page__content">
 <section id="nav">
    <div class="nav">
        <div class="nav__header">
            <h1>Movies</h1>
        </div>
        <ul class="nav__links">
            <li> <a href="http://127.0.0.1:5500/index.html" class="nav__link">Home</a></li>
        </ul>
    </div>
 </section>

 <section class="search">
 <form id="search-form" action="/search" method="GET" class="search-container">
  <input 
    type="search" 
    id="search-input" 
    name="q" 
    placeholder="Search here..." 
    aria-label="Search through site content"
    required
  >
  <button id="search-button" type="submit">Search</button>
</form>
</section>

<div class="filter__container hidden" id="filter__container">
  <label for="sort-select">Sort by</label>
  <select id="sort-select">
    <option value="">Default</option>
    <option value="year-desc">Year (Newest first)</option>
    <option value="year-asc">Year (Oldest first)</option>
    <option value="rating-desc">Rating (Highest first)</option>
    <option value="rating-asc">Rating (Lowest first)</option>
  </select>
</div>

<div id="loading__spinner" class="hidden">
    <i class="fa-solid fa-spinner fa-spin"></i>
</div>
<div id="displayResults"></div>

<div id="modal__overlay" class="hidden">
    <div class="modal__content">
        <button id="modal__close-btn">✕</button>
        <div id="modal__details"></div>
    </div>
</div>
</div>
 <footer>
                 <div class="footer__copyright">
                     © 2026 Steve Knopf. All Rights Reserved.
                 </div>
             </footer>
</body>
  
</html>
